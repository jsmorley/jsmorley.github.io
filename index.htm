<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>JSMorley Homepage</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="app.css">
  <script src="seed.js" defer></script>
  <script src="site-data.js" defer></script>
  <script src="publisher.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a id="open-editor" href="editor.html" aria-label="Edit homepage" title="Edit homepage" hidden><svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><g transform="rotate(45 16 16)"><rect x="12" y="2" width="8" height="7" rx="2" fill="#ef82a6"/><path d="M12 8h8v3h-8z" fill="#c7d5df"/><path d="M12 11h8v13h-8z" fill="#ffc83d"/><path d="M16 11h4v13h-4z" fill="#ed9d13"/><path d="m12 24 4 7 4-7z" fill="#edc495"/><path d="m14.3 28 1.7 3 1.7-3z" fill="#283340"/><path d="M13 12h1v11h-1z" fill="#fff0a3"/></g></svg></a>
  <header id="toolbar" hidden>
    <span id="page-label">JSMorley Homepage</span>
    <button id="organize">Organize</button>
    <button id="add-item">Add link</button>
    <button id="manage">Folders</button>
    <button id="publish">Publish to GitHub</button>
    <a class="toolbar-button" href="https://github.com/jsmorley/jsmorley.github.io/actions" target="_blank" rel="noopener noreferrer">Deployment status</a>
    <button id="backup">Backup</button>
    <button id="import">Import backup</button>
    <button id="readonly">Read-only view</button>
    <span id="save-status" role="status"></span>
  </header>
  <main id="grid" aria-label="Bookmarks"></main>
  <p id="notice" role="status" hidden></p>
  <dialog id="panel" aria-labelledby="panel-title">
    <form id="editor-form">
      <div class="dialog-heading"><h1 id="panel-title">Edit item</h1><button type="button" id="close" aria-label="Close panel">×</button></div>
      <div id="fields"></div>
      <p id="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="delete" class="danger">Delete</button><span></span><button type="button" id="cancel">Cancel</button><button id="save" type="submit">Save</button></div>
    </form>
  </dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
