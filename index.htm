<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>JSMorley Homepage</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="app.css">
  <script src="seed.js" defer></script>
  <script src="site-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a id="open-editor" href="editor.html" hidden>Edit</a>
  <header id="toolbar" hidden>
    <span id="page-label">JSMorley Homepage</span>
    <button id="organize">Organize</button>
    <button id="add-item">Add link</button>
    <button id="manage">Folders</button>
    <button id="export">Export for GitHub</button>
    <button id="backup">Backup</button>
    <button id="import">Import backup</button>
    <button id="readonly">Read-only view</button>
    <span id="save-status" role="status"></span>
  </header>
  <main id="grid" aria-label="Bookmarks"></main>
  <p id="notice" role="status" hidden></p>
  <dialog id="panel" aria-labelledby="panel-title">
    <form id="editor-form">
      <div class="dialog-heading"><h1 id="panel-title">Edit item</h1><button type="button" id="close" aria-label="Close panel">×</button></div>
      <div id="fields"></div>
      <p id="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="delete" class="danger">Delete</button><span></span><button type="button" id="cancel">Cancel</button><button id="save" type="submit">Save</button></div>
    </form>
  </dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
